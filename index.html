 {k:'multi', q:'Какие события обязаны попадать в журнал?',
  opts:[
   'Вход, выход, неудачные попытки входа',
   'Отказы в доступе (403) и обращения к чужим объектам',
   'Изменение прав и роли пользователя',

  ],
  right:[0,1,2,3,4,5],
  expl:`Правило отбора: в журнал идёт то, что <b>меняет права, деньги или доступ к персональным данным</b> — и все отказы. Логировать каждый клик бессмысленно: важные события утонут в шуме, а сам журнал станет хранилищем персональных данных. И последнее требование, которое почти никогда не проверяют: <b>журнал должен быть неизменяемым</b> — если пользователь (или администратор) может отредактировать записи, аудита фактически нет.`}

/* ============================== СОСТОЯНИЕ ============================== */
const LSKEY = 'bagodrom.progress.v1';
let ST = {res:{}};
try{ const raw = localStorage.getItem(LSKEY); if(raw){ const p = JSON.parse(raw); if(p && p.res) ST = p; } }catch(e){}
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(ST)); }catch(e){} }

const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
let toastT = null;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('is-on');
  clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove('is-on'), 2600);
}
const task = id => TASKS.find(t=>t.id===id);
const tasksOf = mod => TASKS.filter(t=>t.mod===mod);
const maxOf = t => t.questions.length + (t.goal?1:0);
const resOf = id => ST.res[id] || null;
const isOk = id => !!(ST.res[id] && ST.res[id].ok);
function modStats(mod){
  const list = tasksOf(mod);
  return {total:list.length, done:list.filter(t=>isOk(t.id)).length};
}
function updateXp(){
  const done = TASKS.filter(t=>isOk(t.id)).length;
  document.getElementById('xpDone').textContent = done;
  document.getElementById('xpAll').textContent = TASKS.length;
  document.getElementById('xpBar').style.width = (TASKS.length? done/TASKS.length*100:0)+'%';
}
function firstUnfinished(){
  for(const m of MODULES){ const t = tasksOf(m.id).find(x=>!isOk(x.id)); if(t) return t; }
  return null;
}

/* ============================== РОУТЕР ============================== */
function go(hash){ if(location.hash===hash) render(); else location.hash = hash; }
window.addEventListener('hashchange', render);
document.getElementById('brandBtn').onclick = ()=>go('#/');
document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('Сбросить весь прогресс? Ответы и пройденные задачи будут удалены.')){
    ST = {res:{}}; save(); updateXp(); render(); toast('Прогресс сброшен');
  }
};

function render(){
  const h = location.hash.replace(/^#/,'');
  window.scrollTo({top:0,behavior:'instant'});
  if(h.startsWith('/t/')){ const t = task(h.slice(3)); if(t) return viewTask(t); }
  if(h.startsWith('/m/')){ const m = MODULES.find(x=>x.id===h.slice(3)); if(m) return viewModule(m); }
  viewHome();
}

/* ============================== ГЛАВНАЯ ============================== */
function viewHome(){
  const next = firstUnfinished();
  const doneCount = TASKS.filter(t=>isOk(t.id)).length;
  const labCount = TASKS.filter(t=>t.lab).length;
  app.innerHTML = `
  <section class="hero"><div class="wrap hero__grid">
    <div>
      <div class="eyebrow">тренажёр для начинающих тестировщиков</div>
      <h1>Учиться ломать <em>на живых стендах</em>, а не по конспекту</h1>
      <p class="hero__lede">Восемь модулей: кривая форма регистрации, симулятор DevTools с настоящим Network, конструктор запросов к API, подмена cookie и правка JWT. В каждой задаче — стенд, вопросы и подробный разбор ответа.</p>
      <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap">

/* ---------- вопросы ---------- */
function renderQ(q,i){
  const kind = q.k==='single' ? 'один вариант' : q.k==='multi' ? 'несколько вариантов' : 'сопоставление';
  let body='';
  if(q.k==='single'||q.k==='multi'){
    body = `<div class="opts">${q.opts.map((o,j)=>`
      <label class="opt" data-q="${i}" data-o="${j}">
        <input type="${q.k==='single'?'radio':'checkbox'}" name="q${i}" value="${j}">
        <span class="opt__txt">${o}</span>
        <span class="opt__tag"></span>
      </label>`).join('')}</div>`;
  } else {
    const pool = q.pairs.map(p=>p[1]).slice().sort((a,b)=>a.localeCompare(b,'ru'));
    body = `<div class="match">${q.pairs.map((p,j)=>`
      <div class="match__row" data-q="${i}" data-r="${j}">
        <span class="match__key">${p[0]}</span>
        <select data-q="${i}" data-r="${j}">
          <option value="">— выбрать —</option>
          ${pool.map(v=>`<option value="${v.replace(/"/g,'&quot;')}">${v.replace(/<[^>]+>/g,'')}</option>`).join('')}
        </select>
      </div>`).join('')}</div>`;
  }
  return `<div class="q" data-qi="${i}">
    <div class="q__title">${i+1}. ${q.q}</div>
    <div class="q__kind">${kind}</div>
    ${body}
    <div class="expl" id="expl${i}" style="display:none"></div>
  </div>`;
}
function wireQ(){
  app.querySelectorAll('.opt input').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const lab = inp.closest('.opt'); const qi = +lab.dataset.q;
      if(inp.type==='radio') app.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(l=>l.classList.remove('opt--sel'));
      lab.classList.toggle('opt--sel', inp.checked);
      clearMarks(qi);
    });
  });
  app.querySelectorAll('.match select').forEach(sel=>{
    sel.addEventListener('change', ()=> clearMarks(+sel.dataset.q));
  });
}
function clearMarks(qi){
  app.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(l=>l.classList.remove('opt--right','opt--wrong','opt--miss'));
  app.querySelectorAll(`.opt[data-q="${qi}"] .opt__tag`).forEach(s=>s.textContent='');
  app.querySelectorAll(`.match__row[data-q="${qi}"]`).forEach(r=>r.classList.remove('is-right','is-wrong'));
}
function readQ(q,i){
  if(q.k==='single'){
    const sel = app.querySelector(`.opt[data-q="${i}"] input:checked`);
    return sel? [+sel.value] : [];
  }
  if(q.k==='multi'){
    return [...app.querySelectorAll(`.opt[data-q="${i}"] input:checked`)].map(x=>+x.value);
  }
  return [...app.querySelectorAll(`.match select[data-q="${i}"]`)].map(s=>s.value);
}
function gradeQ(q,i,ans){
  if(q.k==='match'){
    let allRight = true;
    q.pairs.forEach((p,j)=>{
      const row = app.querySelector(`.match__row[data-q="${i}"][data-r="${j}"]`);
      const right = ans[j]===p[1];
      row.classList.add(right?'is-right':'is-wrong');
      if(!right) allRight=false;
    });
    return allRight;
  }
  const right = q.k==='single' ? [q.right] : q.right;
  let allRight = ans.length>0;
  q.opts.forEach((o,j)=>{
    const lab = app.querySelector(`.opt[data-q="${i}"][data-o="${j}"]`);
    const tag = lab.querySelector('.opt__tag');
    const isRight = right.includes(j), picked = ans.includes(j);
    if(picked && isRight){ lab.classList.add('opt--right'); tag.textContent='верно'; }
    else if(picked && !isRight){ lab.classList.add('opt--wrong'); tag.textContent='лишнее'; allRight=false; }
    else if(!picked && isRight){ lab.classList.add('opt--miss'); tag.textContent='пропущено'; allRight=false; }
  });
  return allRight;
}
function check(){
  const t = RT.task;
  let score = 0, unanswered = 0;
  t.questions.forEach((q,i)=>{
    clearMarks(i);
    const ans = readQ(q,i);
    const empty = q.k==='match' ? ans.some(v=>v==='') : ans.length===0;
    if(empty) unanswered++;
    const ok = gradeQ(q,i,ans);
    if(ok) score++;
    const ex = document.getElementById('expl'+i);
    ex.style.display='block';
    ex.innerHTML = `<b>${ok?'Верно.':'Разбор.'}</b> ${q.expl}`;
  });
  const max = maxOf(t);
  if(t.goal && RT.solved) score++;
  const ok = score===max;
  const prevBest = resOf(t.id);
  if(!prevBest || score>prevBest.score || ok){
    ST.res[t.id] = {score:Math.max(score, prevBest?prevBest.score:0), max, ok: ok || !!(prevBest&&prevBest.ok), solved:RT.solved};
  } else { ST.res[t.id].solved = RT.solved || ST.res[t.id].solved; }
  save(); updateXp();
  const v = document.getElementById('verdict');
  v.className = 'verdict '+(ok?'verdict--ok':'verdict--no');
  if(ok) v.textContent = `${score}/${max} — задача пройдена`;
  else if(t.goal && !RT.solved) v.textContent = `${score}/${max} — цель на стенде ещё не выполнена`;
  else if(unanswered) v.textContent = `${score}/${max} — есть вопросы без ответа`;
  else v.textContent = `${score}/${max} — читай разборы и поправь ответы`;
  if(ok) toast('Задача пройдена: '+score+'/'+max);
  const first = app.querySelector('.opt--wrong,.opt--miss,.match__row.is-wrong');
  if(first && !ok) first.scrollIntoView({block:'center', behavior:'smooth'});
}
function markGoal(){
  const box = document.getElementById('goalBox'); if(!box) return;
  box.classList.add('goal--done');
  box.querySelector('.goal__ic').textContent = '✓';
  const t = document.getElementById('goalTxt');
  if(t) t.innerHTML = RT.task.goal.text + ' <b style="display:inline; color:var(--pass); letter-spacing:0; text-transform:none; font-size:13px">— выполнено</b>';
}
function solveGoal(msg){
  if(RT.solved) return;
  RT.solved = true;
  const r = ST.res[RT.task.id] || {score:0,max:maxOf(RT.task),ok:false};
  r.solved = true; ST.res[RT.task.id] = r; save();
  markGoal(); toast(msg||'Цель на стенде выполнена');
}

/* ---------- стенд: форма регистрации ---------- */
function labForm(host){
  host.innerHTML = frame('https://shop.test/signup', `
    <form id="rgForm" novalidate autocomplete="off">
      <div class="formgrid">
        ${[['name','Имя','text'],['email','Email','text'],['phone','Телефон','text'],['age','Возраст','text'],
           ['pass','Пароль','password'],['pass2','Повтор пароля','password']].map(([k,l,ty])=>`
          <div class="field">
            <label for="f_${k}">${l} ${k==='phone'?'':'<span class="req">*</span>'}</label>
            <input type="${ty}" id="f_${k}">
            <div class="field__err" id="e_${k}"></div>
          </div>`).join('')}
      </div>
      <label class="opt" style="background:transparent; border-style:dashed">
        <input type="checkbox" id="f_agree">
        <span class="opt__txt">Принимаю условия обслуживания</span>
      </label>
      <div class="field__err" id="e_agree" style="margin:4px 0 10px"></div>
      <button class="btn" type="submit">Создать аккаунт</button>
    </form>
    <div id="rgOut" style="margin-top:12px"></div>`);

  const g = id => document.getElementById(id);
  const vals = () => ({
    name:g('f_name').value, email:g('f_email').value, phone:g('f_phone').value,
    age:g('f_age').value, pass:g('f_pass').value, pass2:g('f_pass2').value, agree:g('f_agree').checked
  });
  /* валидация «как её написал разработчик» — с дефектами */
  function buggy(v){
    const e = {};
    if(v.name.length === 0) e.name = 'Укажите имя';
    if(!/^\S+@\S+$/.test(v.email)) e.email = 'Некорректный email';
    if(v.age === '') e.age = 'Укажите возраст';
    else if(isNaN(Number(v.age))) e.age = 'Возраст должен быть числом';
    if(v.pass.length < 6) e.pass = 'Минимум 6 символов';
    if(!v.agree) e.agree = 'Нужно принять условия';
    return e;
  }
  /* что на самом деле требует ТЗ */
  function spec(v){
    const out = [];
    const nm = v.name.trim();
    if(nm.length < 2 || nm.length > 64) out.push('имя должно быть 2–64 символа и не из одних пробелов');
    if(!/^[^\s@]+@[^\s@]+\.[A-Za-zА-Яа-я]{2,}$/.test(v.email)) out.push('email должен содержать домен и доменную зону');
    if(v.phone.trim() !== ''){
      const d = (v.phone.match(/\d/g)||[]).length;
      if(!/^[\d+\s()-]+$/.test(v.phone) || d < 11 || d > 15) out.push('телефон: только цифры, +, пробелы и дефисы, 11–15 цифр');
    }
    if(!/^\d+$/.test(v.age.trim()) || +v.age < 18 || +v.age > 120) out.push('возраст: целое число от 18 до 120');
    if(v.pass.length < 8) out.push('пароль минимум 8 символов');
    if(v.pass !== v.pass2) out.push('пароль и повтор должны совпадать');
    if(!v.agree) out.push('согласие с условиями обязательно');
    return out;
  }
  g('rgForm').addEventListener('submit', ev=>{
    ev.preventDefault();
    const v = vals(), e = buggy(v), bad = spec(v);
    ['name','email','phone','age','pass','pass2','agree'].forEach(k=> g('e_'+k).textContent = e[k]||'');
    const out = g('rgOut');
    if(Object.keys(e).length){
      out.innerHTML = `<span class="chip chip--no">форма не отправлена</span>`;
      return;
    }
    out.innerHTML = `
      <div style="padding:12px 13px; border:1px solid var(--pass); background:var(--pass-soft); border-radius:10px">
        <div style="font-weight:700; margin-bottom:4px">Аккаунт создан</div>
        <div class="mono" style="font-size:12px; color:var(--ink-2)">POST /api/v1/users → 201 Created</div>
        ${bad.length? `<div style="margin-top:9px; font-size:14px">
            <span class="chip chip--warn">по ТЗ это нарушение</span>
            <ul style="margin:8px 0 0; padding-left:20px; color:var(--ink-2)">${bad.map(x=>`<li>${x}</li>`).join('')}</ul>
          </div>`
          : `<div style="margin-top:8px; font-size:14px; color:var(--ink-2)">Данные соответствуют ТЗ — попробуй теперь нарушить какое-нибудь правило.</div>`}
      </div>`;
    if(bad.length) solveGoal('Форма приняла данные вне ТЗ — цель выполнена');
  });
}

function labNet(host, cfg){

  const span = Math.max(...reqs.map(r=>r.t0+r.t), 1);
  const fmtT = ms => ms>=1000 ? (ms/1000).toFixed(2).replace('.',',')+' с' : ms+' мс';
  const stCls = st => st===0? 'st--0' : 'st--'+String(st)[0];
  let tab = cfg.tab||'network', sel = 0, dtab = 'headers';

  host.innerHTML = frame(cfg.url, '', `
    <div class="dt">
      <div class="dt__tabs" role="tablist">
        ${[['network','Network'],['console','Console'],['application','Application']].map(([k,l])=>
          `<button class="dt__tab" role="tab" data-tab="${k}">${l}</button>`).join('')}
      </div>
      <div class="dt__pane" id="dtPane"></div>
    </div>`);

  function paneNetwork(){
    const r = reqs[sel];
    return `<div class="tblscroll"><table class="nettable">
      <thead><tr><th>Запрос</th><th>Метод</th><th>Статус</th><th>Тип</th><th>Размер</th><th>Время</th><th style="min-width:110px">Waterfall</th></tr></thead>
      <tbody>${reqs.map((q,i)=>`<tr data-row="${i}" class="${i===sel?'is-sel':''}">
        <td class="u">${q.u}</td><td>${q.m}</td>
        <td class="st ${stCls(q.st)}">${q.st===0?'(failed)':q.st}</td>
        <td>${q.ty}</td><td>${q.size}</td><td>${fmtT(q.t)}</td>
        <td><span class="wf"><i style="left:${q.t0/span*100}%; width:${Math.max(q.t/span*100,1.5)}%"></i></span></td>
      </tr>`).join('')}</tbody></table></div>
      <div class="detail">
        <div class="detail__tabs">
          ${[['headers','Headers'],['payload','Payload'],['response','Response'],['timing','Timing']].map(([k,l])=>
            `<button class="dt__tab" data-dtab="${k}" ${dtab===k?'aria-selected="true"':''}>${l}</button>`).join('')}
        </div>
        <div class="detail__body">${detailBody(r)}</div>
      </div>`;
  }
  function detailBody(r){
    const hh = o => Object.keys(o||{}).length? Object.entries(o).map(([k,v])=>`  ${k}: ${v}`).join('\n') : '  —';
    if(dtab==='headers') return `Общее\n  Метод: ${r.m}\n  Адрес: ${r.u}\n  Статус: ${r.st===0?'(заблокировано браузером)':r.st}\n\nЗаголовки запроса\n${hh(r.req)}\n\nЗаголовки ответа\n${hh(r.res)}`;
    if(dtab==='payload') return r.payload? r.payload : '— тела запроса нет —';
    if(dtab==='response') return r.body || '— тело ответа пустое —';
    return r.timing? Object.entries(r.timing).map(([k,v])=>`  ${k}: ${v}`).join('\n')
      : `  Всего: ${fmtT(r.t)}\n  (подробный тайминг для этого запроса не записан)`;
  }
  function paneConsole(){
    return `<div class="console">${(cfg.console||[]).map(l=>
      `<div class="console__l console__l--${l.lvl}"><span class="console__src">${l.src||''}</span>${l.txt}</div>`).join('')
      || '<div class="console__l console__l--log">— консоль пуста —</div>'}</div>`;
  }
  function paneApp(){
    const s = cfg.storage||{};
    const ck = (s.cookies||[]).map(c=>`<tr>
        <td>${c.n}</td><td>${c.v}</td><td>${c.d}</td><td>${c.p}</td>
        <td>${c.ho?'✓':''}</td><td>${c.se?'✓':''}</td><td>${c.ss||''}</td><td>${c.ex||'session'}</td></tr>`).join('');
    const kv = arr => (arr&&arr.length)? arr.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')
                                       : '<tr><td colspan="2" style="color:var(--muted)">пусто</td></tr>';

/* ---------- стенд: конструктор запросов ---------- */
const SERVERS = {
  usersV1(rq){
    const p = rq.path.split('?')[0].replace(/\/$/,'');
    if(p !== '/api/v1/users') return {st:404, txt:'Not Found', body:{error:'not_found', path:p}};
    if(rq.method==='GET') return {st:200, txt:'OK', body:{items:[{id:7,name:'Анна',email:'anna@mail.ru',age:30}], total:1}};
    if(rq.method!=='POST') return {st:405, txt:'Method Not Allowed', hdr:{allow:'GET, POST'}, body:{error:'method_not_allowed'}};
    let d;
    try{ d = JSON.parse(rq.body||''); }
    catch(e){ return {st:400, txt:'Bad Request', body:{error:'invalid_json', message:String(e.message)}}; }
    if(d.email===undefined) return {st:500, txt:'Internal Server Error',
      body:{error:'internal_error', message:'Cannot read property "toLowerCase" of undefined at UserService.create (users.js:41)', trace_id:'9c11-ab7f'}};
    if(typeof d.age === 'string') return {st:500, txt:'Internal Server Error',
      body:{error:'internal_error', message:'TypeError: age.toFixed is not a function at UserService.create (users.js:47)', trace_id:'9c11-ab80'}};
    const violations = [];
    if(!/^[^\s@]+@[^\s@]+\.[A-Za-zА-Яа-я]{2,}$/.test(String(d.email))) violations.push('email не является валидным адресом');
    if(!(Number.isInteger(d.age) && d.age>=18 && d.age<=120)) violations.push('age вне диапазона 18–120 или не целое');
    const nm = String(d.name===undefined?'':d.name).trim();
    if(nm.length<2 || nm.length>64) violations.push('name вне 2–64 символов');
    return {st:201, txt:'Created', hdr:{'location':'/api/v1/users/812'},
      body:{id:812, name:d.name===undefined?null:d.name, email:d.email, age:d.age, created_at:'2026-08-25T11:04:12Z'},
      meta:{bad:violations.length>0, violations}};
  },
  invoices(rq){
    const DB = {
      1041:{id:1041, tenant:3, company:'ИП Соколова А.',  amount:'18 400,00 ₽', status:'active',
            contact:{name:'Анна Соколова', phone:'+7 900 000-00-01', inn:'770912345678'}},
      1042:{id:1042, tenant:2, company:'ООО «Ромашка»',      amount:'1 240 000,00 ₽', status:'active',
            contact:{name:'Павел Ерохин', phone:'+7 903 555-90-32', inn:'7712009988'}},
      1043:{id:1043, tenant:7, company:'ООО «Северный ветер»', amount:'96 500,00 ₽', status:'paid',
            contact:{name:'Игорь Сомов', phone:'+7 921 118-44-10', inn:'7801556677'}}
    };
    const ME = 3;
    const p = rq.path.split('?')[0].replace(/\/$/,'');
    const m = p.match(/^\/api\/v1\/invoices\/(\d+)$/);
    if(p === '/api/v1/invoices'){
      if(rq.method!=='GET') return {st:405, txt:'Method Not Allowed', body:{error:'method_not_allowed'}};
      return {st:200, txt:'OK', body:{items:[DB[1041]], total:1}, meta:{}};
    }
    if(!m) return {st:404, txt:'Not Found', body:{error:'not_found', path:p}};
    const inv = DB[+m[1]];
    if(!inv) return {st:404, txt:'Not Found', body:{error:'not_found', id:+m[1]}};
    const foreign = inv.tenant !== ME;
    if(rq.method==='GET') return {st:200, txt:'OK', body:inv, meta:{foreign}};
    if(rq.method==='PATCH'){
      let d; try{ d = JSON.parse(rq.body||'{}'); }catch(e){ return {st:400, txt:'Bad Request', body:{error:'invalid_json'}}; }
      return {st:200, txt:'OK', body:Object.assign({}, inv, d, {updated_at:'2026-08-25T11:08:20Z'}), meta:{foreign}};
    }
    return {st:405, txt:'Method Not Allowed', hdr:{allow:'GET, PATCH'}, body:{error:'method_not_allowed'}};
  }
};
function labApi(host, cfg){
  const methods = cfg.methods || ['GET','POST'];
  host.innerHTML = `
    <div class="rb">
      <div class="rb__line">
        <select id="rbM">${methods.map(m=>`<option ${m===cfg.method?'selected':''}>${m}</option>`).join('')}</select>
        <input type="text" id="rbP" value="${cfg.path}" spellcheck="false">
        <button class="btn btn--sm" id="rbSend">Отправить</button>
      </div>
      ${cfg.presets? `<div class="rb__line" style="gap:6px">
        <span class="eyebrow" style="margin-right:2px">пресеты</span>
        ${cfg.presets.map((p,i)=>`<button class="btn btn--quiet btn--sm" data-pre="${i}">${p.label}</button>`).join('')}
      </div>`:''}
      <div id="rbBodyWrap">
        <div class="eyebrow" style="margin-bottom:5px">тело запроса · JSON</div>
        <textarea id="rbB" rows="6" spellcheck="false">${cfg.body||''}</textarea>
      </div>
      <div class="rb__log" id="rbLog"></div>
    </div>`;
  const $ = id => document.getElementById(id);
  const bodyless = m => m==='GET'||m==='DELETE'||m==='HEAD';
  function syncBody(){ $('rbBodyWrap').style.display = bodyless($('rbM').value)? 'none':'block'; }
  $('rbM').onchange = syncBody; syncBody();
  (cfg.presets||[]).forEach((p,i)=>{
    host.querySelector(`[data-pre="${i}"]`).onclick = ()=>{
      if(p.method) $('rbM').value = p.method;
      if(p.path) $('rbP').value = p.path;
      if(p.body!==undefined) $('rbB').value = p.body;
      syncBody(); toast('Пресет подставлен, жми «Отправить»');
    };
  });
  $('rbSend').onclick = ()=>{
    const rq = {method:$('rbM').value, path:$('rbP').value.trim(), body:bodyless($('rbM').value)? '' : $('rbB').value};
    const r = SERVERS[cfg.server](rq);
    const cls = r.st>=500? 'st--5' : r.st>=400? 'st--4' : r.st>=300? 'st--3':'st--2';
    const hdr = Object.assign({'content-type':'application/json'}, r.hdr||{});
    const el = document.createElement('div');
    el.className = 'res';
    el.innerHTML = `
      <div class="res__h"><span class="m">${rq.method}</span><span class="p">${rq.path}</span>
        <span class="st ${cls}">${r.st} ${r.txt}</span>
        ${r.meta && r.meta.bad? '<span class="chip chip--no">принято вне контракта</span>':''}
        ${r.meta && r.meta.foreign? '<span class="chip chip--no">чужая организация</span>':''}
      </div>
      <div class="res__b">${Object.entries(hdr).map(([k,v])=>k+': '+v).join('\n')}\n\n${JSON.stringify(r.body,null,2)}</div>`;
    const log = $('rbLog'); log.insertBefore(el, log.firstChild);
    if(cfg.server==='usersV1' && r.st===201 && r.meta && r.meta.bad)
      solveGoal('Сервер создал пользователя вне контракта — цель выполнена');
    if(cfg.server==='invoices' && r.st>=200 && r.st<300 && r.meta && r.meta.foreign)
      solveGoal('Сервер отдал чужой счёт — цель выполнена');
  };
}
